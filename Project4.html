<!DOCTYPE html>
<html>
<head>
    <title>Movie Watchlist Manager</title>
    <link rel="stylesheet" href="Project4.css">
</head>
<body>

<h1>Movie Watchlist Manager</h1>

<form>

    <input
        type="text"
        id="movieName"
        placeholder="Movie Name"
    >

    <br><br>

    <select id="genre">

        <option value="">Select Genre</option>

        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Horror">Horror</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Romance">Romance</option>

    </select>

    <br><br>

    <input
        type="number"
        id="rating"
        placeholder="Rating (1-10)"
    >

    <br><br>

    <button id="addMovieBtn">
        Add Movie
    </button>

</form>

<hr>

<h2>Filter</h2>

<select id="filterMovie">

    <option value="All">All</option>

    <option value="Watched">Watched</option>
    <option value="Not Watched">Not Watched</option>

    <option value="Action">Action</option>
    <option value="Comedy">Comedy</option>
    <option value="Horror">Horror</option>
    <option value="Sci-Fi">Sci-Fi</option>
    <option value="Romance">Romance</option>

</select>

<hr>

<h2>Movies</h2>

<div id="movieList"></div>

<hr>

<h2>Statistics</h2>

<p>Total Movies :
    <span id="totalMovies"></span>
</p>

<p>Watched :
    <span id="watchedMovies"></span>
</p>

<p>Not Watched :
    <span id="notWatchedMovies"></span>
</p>

<p>Highest Rating :
    <span id="highestRating"></span>
</p>

<p>Average Rating :
    <span id="averageRating"></span>
</p>

<script src="Project4.js"></script>

</body>
</html>
